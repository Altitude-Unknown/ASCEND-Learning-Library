<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="t">Inside a MEMS accelerometer</title>
  <desc id="d">A proof mass held by springs inside a fixed frame, with fingers on the mass between fixed capacitor plates. When the frame accelerates, the mass lags behind, the gaps change, and the chip measures the change in capacitance.</desc>
  <rect width="900" height="520" fill="#ffffff"/>
  <!-- frame -->
  <rect x="60" y="60" width="600" height="400" rx="10" fill="#eef1f4" stroke="#44515e" stroke-width="4"/>
  <text x="80" y="92" font-size="20" fill="#2b3640" font-weight="600">Fixed frame (moves with the aircraft)</text>
  <!-- springs left and right -->
  <polyline points="64,270 90,270 100,250 115,290 130,250 145,290 160,250 175,290 185,270 210,270" fill="none" stroke="#2b3640" stroke-width="4"/>
  <polyline points="510,270 535,270 545,250 560,290 575,250 590,290 605,250 620,290 630,270 656,270" fill="none" stroke="#2b3640" stroke-width="4"/>
  <!-- proof mass (shifted slightly left: lags behind when frame accelerates right) -->
  <rect x="210" y="200" width="300" height="140" rx="6" fill="#c9d8ef" stroke="#2d5a9e" stroke-width="4"/>
  <text x="360" y="278" font-size="22" text-anchor="middle" fill="#1d3c6b" font-weight="700">Proof mass</text>
  <!-- moving fingers on mass (top) and fixed plates -->
  <g stroke-width="6">
    <line x1="250" y1="200" x2="250" y2="140" stroke="#2d5a9e"/>
    <line x1="330" y1="200" x2="330" y2="140" stroke="#2d5a9e"/>
    <line x1="410" y1="200" x2="410" y2="140" stroke="#2d5a9e"/>
    <line x1="490" y1="200" x2="490" y2="140" stroke="#2d5a9e"/>
    <line x1="268" y1="110" x2="268" y2="170" stroke="#b5532a"/>
    <line x1="348" y1="110" x2="348" y2="170" stroke="#b5532a"/>
    <line x1="428" y1="110" x2="428" y2="170" stroke="#b5532a"/>
    <line x1="508" y1="110" x2="508" y2="170" stroke="#b5532a"/>
    <line x1="250" y1="110" x2="520" y2="110" stroke="#b5532a"/>
  </g>
  <!-- bottom fingers -->
  <g stroke-width="6">
    <line x1="250" y1="340" x2="250" y2="400" stroke="#2d5a9e"/>
    <line x1="330" y1="340" x2="330" y2="400" stroke="#2d5a9e"/>
    <line x1="410" y1="340" x2="410" y2="400" stroke="#2d5a9e"/>
    <line x1="490" y1="340" x2="490" y2="400" stroke="#2d5a9e"/>
    <line x1="268" y1="370" x2="268" y2="430" stroke="#b5532a"/>
    <line x1="348" y1="370" x2="348" y2="430" stroke="#b5532a"/>
    <line x1="428" y1="370" x2="428" y2="430" stroke="#b5532a"/>
    <line x1="508" y1="370" x2="508" y2="430" stroke="#b5532a"/>
    <line x1="250" y1="430" x2="520" y2="430" stroke="#b5532a"/>
  </g>
  <!-- acceleration arrow -->
  <line x1="300" y1="490" x2="560" y2="490" stroke="#2b3640" stroke-width="4"/>
  <polygon points="560,480 582,490 560,500" fill="#2b3640"/>
  <text x="285" y="497" font-size="18" fill="#2b3640" text-anchor="end">Frame accelerates</text>
  <!-- callouts -->
  <g font-size="18" fill="#2b3640">
    <text x="690" y="125">Fixed plates</text>
    <text x="690" y="147" fill="#b5532a" font-weight="600">(orange)</text>
    <line x1="685" y1="130" x2="525" y2="125" stroke="#7a8794" stroke-width="2"/>
    <text x="690" y="205">Fingers on the</text>
    <text x="690" y="227">proof mass</text>
    <text x="690" y="249" fill="#2d5a9e" font-weight="600">(blue)</text>
    <line x1="685" y1="212" x2="495" y2="175" stroke="#7a8794" stroke-width="2"/>
    <text x="690" y="300">Springs</text>
    <line x1="685" y1="295" x2="625" y2="280" stroke="#7a8794" stroke-width="2"/>
    <text x="690" y="360">The mass lags</text>
    <text x="690" y="382">behind, the gaps</text>
    <text x="690" y="404">change, and the</text>
    <text x="690" y="426">chip measures</text>
    <text x="690" y="448">the capacitance.</text>
  </g>
</svg>
